<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Next LvL</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="enquiry.css">
</head>
<body class="bg-image">
    <header class="top-banner">
        <a href="Index.HTML" class="logo-wrap" aria-label="Home page">
            <img src="Images/NextLvl.png" alt="NextLvl Logo" class="site-logo">
        </a>
        <nav class="top-nav" aria-label="Main navigation">
            <a class="nav-btn" href="Index.HTML">Home</a>
            <a class="nav-btn" href="About.html">About</a>
            <a class="nav-btn" href="Products.html">Products</a>
            <a class="nav-btn" href="contact.html">Contact</a>
            <a class="nav-btn" href="enquiry.html" aria-current="page">Enquiry</a>
            <span id="dynamic-actions"></span>
        </nav>
    </header>

    <main class="page-wrap">
        <section class="section">
            <div class="section-header">
                <span class="kicker">Enquiry</span>
                <h2>Tell us what you need.</h2>
                <p>Submit an enquiry and our team will help you find the perfect gaming setup, product recommendation, or business solution.</p>
                <p style="margin-top: 16px;"><a href="calculate-fees.html" style="color: var(--accent); font-weight: 700;">Calculate VAT and fees first</a></p>
            </div>

            <div class="form-card">
                <form>
                    <div class="form-grid">
                        <div>
                            <label for="first-name">First Name</label>
                            <input id="first-name" name="first-name" type="text" placeholder="First name" autocomplete="given-name" required>
                        </div>
                        <div>
                            <label for="last-name">Last Name</label>
                            <input id="last-name" name="last-name" type="text" placeholder="Last name" autocomplete="family-name" required>
                        </div>
                        <div>
                            <label for="product-type">Interested In</label>
                            <select id="product-type" name="product-type">
                                <option>Gaming Headset</option>
                                <option>Mechanical Keyboard</option>
                                <option>Gaming Mouse</option>
                                <option>Gaming Chair</option>
                                <option>Custom Setup</option>
                            </select>
                        </div>
                        <div>
                            <label for="phone">Phone Number</label>
                            <input id="phone" name="phone" type="tel" placeholder="+27 00 000 0000" autocomplete="tel">
                        </div>
                        <div class="full">
                            <label for="enquiry-message">Detailed Enquiry</label>
                            <textarea id="enquiry-message" name="message" placeholder="Please share your requirements, budget, and timeline..."></textarea>
                        </div>
                    </div>
                    <button class="submit-btn" type="submit">Submit Enquiry</button>
                </form>
            </div>
        </section>
        <img src="Images/Enquiry Page.jpg" alt="Gamer HQ Memberships" style="max-width: 100%; margin-top: 24px; border-radius: 18px; border: 1px solid rgba(217, 255, 92, 0.18);">
    </main>

    <footer class="footer">
        © 2026 Next LvL Gaming. All rights reserved.
    </footer>

    <script>
        (function () {
            const nav = document.getElementById('dynamic-actions');
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
            const accountLink = document.createElement('a');
            accountLink.className = 'nav-btn';
            accountLink.style.marginLeft = '8px';

            if (currentUser && currentUser.username) {
                accountLink.href = 'profile.html';
                accountLink.textContent = `Yetti: ${currentUser.username}`;
                nav.appendChild(accountLink);

                const cartLink = document.createElement('a');
                cartLink.className = 'nav-btn cart-btn';
                cartLink.href = 'cart.html';
                cartLink.textContent = 'Cart';
                nav.appendChild(cartLink);
            } else {
                accountLink.href = 'signup.html';
                accountLink.textContent = 'Sign up';
                nav.appendChild(accountLink);
            }
        })();
    </script>
</body>
</html>
