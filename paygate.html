<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Paygate | Next LvL</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-image">
    <header class="top-banner">
        <a href="Index.HTML" class="logo-wrap" aria-label="Home page">
            <img src="Images/NextLvl.png" alt="NextLvl Logo" class="site-logo">
        </a>
    </header>

    <main class="page-wrap">
        <section class="section">
            <div class="form-card">
                <h2>Checkout</h2>
                <div id="cart-contents" style="margin-top:12px;"></div>

                <div style="margin-top:18px;">
                    <h3>Payment Method</h3>
                    <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                        <label style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="method" value="capitec" checked>
                            <img src="Images/Capitec.png" alt="Capitec" style="height:22px;">
                            Capitec Pay
                        </label>
                        <label style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="method" value="ozow">
                            <img src="Images/ozow.png" alt="Ozow" style="height:22px;">
                            Ozow
                        </label>
                        <label style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="method" value="card">
                            <img src="Images/mastercard.webp" alt="Mastercard" style="height:20px;">
                            Card (saved or new)
                        </label>
                    </div>
                </div>

                <div id="payment-details" style="margin-top:18px; display:none;">
                    <div id="capitec-details" class="payment-detail" style="display:none;">
                        <h4>Capitec Pay details</h4>
                        <label for="capitec-mobile">Capitec mobile number</label>
                        <input id="capitec-mobile" type="tel" inputmode="tel" autocomplete="tel" placeholder="e.g. 082 123 4567" required>
                        <label for="capitec-name">Full name</label>
                        <input id="capitec-name" type="text" autocomplete="name" minlength="2" placeholder="Name on Capitec account" required>
                    </div>

                    <div id="ozow-details" class="payment-detail" style="display:none;">
                        <h4>Ozow details</h4>
                        <label for="ozow-number">Mobile number</label>
                        <input id="ozow-number" type="tel" inputmode="tel" autocomplete="tel" placeholder="e.g. 082 123 4567" required>
                        <label for="ozow-email">Email address</label>
                        <input id="ozow-email" type="email" autocomplete="email" placeholder="you@example.com" required>
                    </div>
                </div>

                <div style="margin-top:18px;" id="cards-section" hidden>
                    <h3>Your Saved Cards</h3>
                    <div id="saved-cards" aria-live="polite"></div>
                    <div style="margin-top:12px;">
                        <h4>Add a Card</h4>
                        <label for="card-number">Card number</label>
                        <input id="card-number" type="text" inputmode="numeric" autocomplete="cc-number" maxlength="23" placeholder="4242 4242 4242 4242">
                        <label for="card-name">Name on card</label>
                        <input id="card-name" type="text" autocomplete="cc-name" minlength="2" placeholder="Cardholder name">
                        <button id="save-card" type="button" class="submit-btn" style="margin-top:8px;">Save card</button>
                        <p class="muted-note">Demo checkout only. Card numbers are validated in your browser and are not stored or sent to a payment provider.</p>
                    </div>
                </div>

                <div style="margin-top:18px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
                    <div><strong>Total:</strong> <span id="grand-total">R0.00</span></div>
                    <button id="pay-btn" type="button" class="submit-btn">Pay now</button>
                </div>
                <p id="checkout-error" role="alert" style="color:#ffb4a8;" hidden></p>
            </div>
        </section>
    </main>

    <footer class="footer">© 2026 Next LvL Gaming. All rights reserved.</footer>

    <script>
        function readStoredArray(key) {
            try {
                const value = JSON.parse(localStorage.getItem(key) || '[]');
                return Array.isArray(value) ? value : [];
            } catch {
                return [];
            }
        }

        function formatR(value) {
            return 'R' + Number(value).toFixed(2);
        }

        function isValidCardNumber(value) {
            const digits = value.replace(/\D/g, '');
            if (digits.length < 13 || digits.length > 19) return false;
            let sum = 0;
            let doubleDigit = false;
            for (let i = digits.length - 1; i >= 0; i--) {
                let digit = Number(digits[i]);
                if (doubleDigit) {
                    digit *= 2;
                    if (digit > 9) digit -= 9;
                }
                sum += digit;
                doubleDigit = !doubleDigit;
            }
            return sum % 10 === 0;
        }

        function isValidSouthAfricanMobile(value) {
            const normalized = value.replace(/[\s()-]/g, '');
            return /^(?:\+27|0)\d{9}$/.test(normalized);
        }

        const cart = readStoredArray('cart');
        const cartEl = document.getElementById('cart-contents');
        const totalEl = document.getElementById('grand-total');
        const savedCardsEl = document.getElementById('saved-cards');
        const cardsSection = document.getElementById('cards-section');
        const checkoutError = document.getElementById('checkout-error');
        let selectedCardIndex = null;
        let total = 0;

        if (!cart.length) {
            cartEl.innerHTML = '<p style="color:var(--muted)">Your cart is empty. Go back and add items.</p>';
        } else {
            const list = document.createElement('ul');
            list.style.listStyle = 'none';
            list.style.padding = '0';
            cart.forEach(item => {
                const price = Number(item && item.price);
                if (!item || typeof item.name !== 'string' || !Number.isFinite(price) || price < 0) return;
                const row = document.createElement('li');
                row.style.padding = '8px 0';
                row.textContent = `${item.name} — ${formatR(price)}`;
                list.appendChild(row);
                total += price;
            });
            if (!list.children.length) {
                cartEl.innerHTML = '<p style="color:var(--muted)">Your cart has no valid items. Return to your cart and try again.</p>';
            } else {
                cartEl.appendChild(list);
            }
        }
        totalEl.textContent = formatR(total);

        function selectSavedCard(index) {
            selectedCardIndex = index;
            document.querySelector('input[name="method"][value="card"]').checked = true;
            updatePaymentDetails();
            renderSavedCards();
        }

        function renderSavedCards() {
            const cards = readStoredArray('cards');
            savedCardsEl.replaceChildren();
            if (!cards.length) {
                savedCardsEl.innerHTML = '<p style="color:var(--muted)">No saved cards. Add a card below.</p>';
                return;
            }
            cards.forEach((card, index) => {
                const lastFour = card && (card.last4 || (typeof card.number === 'string' ? card.number.slice(-4) : ''));
                if (!lastFour) return;
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'secondary-btn';
                button.style.marginRight = '8px';
                button.textContent = `•••• ${lastFour}`;
                button.setAttribute('aria-pressed', String(index === selectedCardIndex));
                button.addEventListener('click', () => selectSavedCard(index));
                savedCardsEl.appendChild(button);
            });
        }

        function updatePaymentDetails() {
            const method = document.querySelector('input[name="method"]:checked')?.value || 'capitec';
            document.getElementById('payment-details').style.display = method === 'capitec' || method === 'ozow' ? 'block' : 'none';
            document.getElementById('capitec-details').style.display = method === 'capitec' ? 'block' : 'none';
            document.getElementById('ozow-details').style.display = method === 'ozow' ? 'block' : 'none';
            cardsSection.hidden = method !== 'card';
            checkoutError.hidden = true;
        }

        renderSavedCards();
        document.querySelectorAll('input[name="method"]').forEach(radio => {
            radio.addEventListener('change', updatePaymentDetails);
        });
        updatePaymentDetails();

        document.getElementById('save-card').addEventListener('click', () => {
            const numberInput = document.getElementById('card-number');
            const nameInput = document.getElementById('card-name');
            const number = numberInput.value.trim();
            const name = nameInput.value.trim();
            numberInput.setCustomValidity(isValidCardNumber(number) ? '' : 'Enter a valid card number (13–19 digits).');
            nameInput.setCustomValidity(name.length >= 2 ? '' : 'Enter the cardholder name.');
            if (!numberInput.reportValidity()) return;
            if (!nameInput.reportValidity()) return;

            const cards = readStoredArray('cards');
            cards.push({ last4: number.replace(/\D/g, '').slice(-4), name });
            localStorage.setItem('cards', JSON.stringify(cards));
            numberInput.value = '';
            nameInput.value = '';
            selectedCardIndex = cards.length - 1;
            document.querySelector('input[name="method"][value="card"]').checked = true;
            updatePaymentDetails();
            renderSavedCards();
        });

        function validatePayment(method) {
            let input;
            if (method === 'capitec') {
                input = document.getElementById('capitec-mobile');
                input.setCustomValidity(isValidSouthAfricanMobile(input.value.trim()) ? '' : 'Enter a valid South African mobile number.');
                if (!input.reportValidity()) return false;
                input = document.getElementById('capitec-name');
                input.setCustomValidity(input.value.trim().length >= 2 ? '' : 'Enter your full name.');
                return input.reportValidity();
            }
            if (method === 'ozow') {
                input = document.getElementById('ozow-number');
                input.setCustomValidity(isValidSouthAfricanMobile(input.value.trim()) ? '' : 'Enter a valid South African mobile number.');
                if (!input.reportValidity()) return false;
                return document.getElementById('ozow-email').reportValidity();
            }
            if (method === 'card') {
                const cards = readStoredArray('cards');
                if (selectedCardIndex === null || !cards[selectedCardIndex]) {
                    checkoutError.textContent = 'Save and select a card before continuing.';
                    checkoutError.hidden = false;
                    return false;
                }
                return true;
            }
            return false;
        }

        document.getElementById('pay-btn').addEventListener('click', () => {
            checkoutError.hidden = true;
            if (!cart.length || total <= 0) {
                checkoutError.textContent = 'Your cart is empty or contains no valid items.';
                checkoutError.hidden = false;
                return;
            }
            const method = document.querySelector('input[name="method"]:checked')?.value;
            if (!validatePayment(method)) return;

            const payButton = document.getElementById('pay-btn');
            payButton.disabled = true;
            payButton.textContent = 'Processing…';
            setTimeout(() => {
                let user = {};
                try {
                    user = JSON.parse(localStorage.getItem('currentUser') || '{}') || {};
                } catch {
                    user = {};
                }
                const order = { id: 'ORDER-' + Date.now(), items: cart, total };
                const accounts = readStoredArray('accounts');
                const accountIndex = accounts.findIndex(account => {
                    const matchEmail = account.email && user.email && account.email.toLowerCase() === user.email.toLowerCase();
                    const matchPhone = account.phone && user.phone && account.phone.toLowerCase() === user.phone.toLowerCase();
                    return matchEmail || matchPhone || (account.username && account.username === user.username);
                });
                if (accountIndex >= 0) {
                    const account = accounts[accountIndex];
                    account.orders = Array.isArray(account.orders) ? account.orders : [];
                    account.orders.push(order);
                    localStorage.setItem('accounts', JSON.stringify(accounts));
                }
                user.orders = Array.isArray(user.orders) ? [...user.orders, order] : [order];
                localStorage.setItem('currentUser', JSON.stringify(user));
                localStorage.setItem('lastOrder', JSON.stringify(order));
                localStorage.removeItem('cart');
                localStorage.removeItem('cartSummary');
                localStorage.removeItem('selectedCard');
                window.location.href = 'payment-success.html';
            }, 800);
        });
    </script>
</body>
</html>
